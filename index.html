<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="KTC Smart Safety - Mine Safety Platform">
  <title>KTC Smart Safety</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #ffffff;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #ffffff;
      transition: opacity .25s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(360px, 100%);
      text-align: center;
    }

    .brand {
      color: #0b3d2e;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .tagline {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 24px auto 0;
      border: 3px solid #e5e5e5;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading-text {
      margin-top: 12px;
      color: #666;
      font-size: 12px;
    }

    .error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #ffffff;
    }

    .error.show {
      display: flex;
    }

    .error-card {
      width: min(420px, 100%);
      padding: 24px;
      text-align: center;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .error-title {
      font-size: 18px;
      font-weight: 700;
    }

    .error-text {
      margin-top: 8px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .retry {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;
      border: 0;
      border-radius: 9px;
      background: #1565c0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 700px) {
      .loading-card {
        width: 420px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">

    <section id="loading" class="loading" aria-label="Memuat KTC Smart Safety">
      <div class="loading-card">
        <div class="brand">KTC SMART SAFETY</div>
        <div class="tagline">Mine Safety Platform</div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="loading-text">Membuka aplikasi...</div>
      </div>
    </section>

    <section id="error" class="error" aria-live="polite">
      <div class="error-card">
        <div class="error-title">KTC Smart Safety</div>
        <div class="error-text">
          Aplikasi belum dapat dimuat. Periksa koneksi internet lalu coba lagi.
        </div>
        <button class="retry" type="button" onclick="reloadApp()">
          COBA LAGI
        </button>
      </div>
    </section>

    <iframe
      id="appFrame"
      title="KTC Smart Safety"
      src="https://script.google.com/macros/s/AKfycbw1EEbz3YS7xGM0dlTrPcWB94PuLA18_-8aLAIxqsMIdAuwHO9QNDknaJ96AaKk827EuQ/exec"
      allow="camera; microphone"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </main>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
 const APP_URL =
  "https://script.google.com/macros/s/AKfycbw1EEbz3YS7xGM0dlTrPcWB94PuLA18_-8aLAIxqsMIdAuwHO9QNDknaJ96AaKk827EuQ/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const page =
  (
    params.get("page") ||
    "login"
  )
  .trim()
  .toLowerCase();


const allowedPages = [
  "login",
  "home",
  "hazard",
  "hse",
  "rework"
];


const currentPage =
  allowedPages.includes(page)
    ? page
    : "login";


frame.src =
  APP_URL +
  "?page=" +
  encodeURIComponent(
    currentPage
  );

    let loaded = false;

    frame.addEventListener("load", function () {
      loaded = true;

      setTimeout(function () {
        loading.classList.add("hidden");
      }, 250);
    });

    frame.addEventListener("error", function () {
      error.classList.add("show");
      loading.classList.add("hidden");
    });

    function reloadApp() {
      error.classList.remove("show");
      loading.classList.remove("hidden");
      frame.src = frame.src.split("#")[0] + "#reload=" + Date.now();
    }

    // Fallback apabila browser tidak memicu error event pada iframe.
    setTimeout(function () {
      if (!loaded) {
        // Tetap biarkan iframe mencoba memuat.
        // Tidak menampilkan error otomatis agar koneksi lambat
        // tidak dianggap sebagai kegagalan.
      }
    }, 12000);
  </script>
</body>
</html>
